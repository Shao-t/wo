  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="airline-data.js?v=20260808-ey-tk"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #f5f5f7;
      overflow: hidden;
    }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    #app {
      position: relative;
      width: 100vw;
      width: 100%;
      height: var(--app-height, 100vh);
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; z-index: 1; }

    .leaflet-tile { filter: saturate(0.45) brightness(1.06); }
    .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }
    .leaflet-tooltip {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #555 !important;
      font-family: -apple-system, sans-serif !important;
      font-size: 10px !important;
      font-weight: 500 !important;
      padding: 0 !important;
      white-space: nowrap !important;
    }
    .route-popup .leaflet-popup-content-wrapper {
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.16);
    }
    .route-popup .leaflet-popup-content {
      margin: 14px 16px;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    .route-popup .leaflet-popup-tip {
      background: rgba(255,255,255,0.94);
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
    }

    /* Kinetics B + C: marker spring feedback, popup spring entrance and route drawing */
    .route-popup .leaflet-popup-content-wrapper {
      transform-origin: 50% 100%;
      animation: popup-spring-in 420ms cubic-bezier(.18,1.25,.4,1) both;
    }
    .route-popup .leaflet-popup-tip-container {
      animation: popup-tip-in 220ms ease-out both;
    }
    .leaflet-overlay-pane svg path.airport-marker-spring {
      transform-box: fill-box;
      transform-origin: center;
      animation: airport-marker-spring 480ms cubic-bezier(.22,1,.36,1) both;
    }
    .leaflet-overlay-pane svg path.airport-arrival-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: airport-arrival-ring 680ms cubic-bezier(.16,1,.3,1) both;
      pointer-events: none;
    }
    .leaflet-overlay-pane svg path.route-line-drawing {
      stroke-linecap: round;
      pointer-events: none;
    }
    .leaflet-overlay-pane svg path.airline-marker-enter {
      transform-box: fill-box;
      transform-origin: center;
      animation: airline-marker-enter 480ms cubic-bezier(.18,1.28,.38,1) both;
      animation-delay: var(--marker-delay, 0ms);
    }
    .leaflet-overlay-pane svg path.airline-marker-exit {
      transform-box: fill-box;
      transform-origin: center;
      animation: airline-marker-exit 170ms cubic-bezier(.4,0,1,1) both;
      pointer-events: none;
    }
    .leaflet-overlay-pane svg path.airport-selected-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: airport-selected-ring-in 420ms cubic-bezier(.18,1.28,.38,1) both;
      pointer-events: none;
      stroke-linecap: round;
    }
    @keyframes airport-marker-spring {
      0%   { transform: scale(1); }
      20%  { transform: scale(.88); }
      55%  { transform: scale(1.28); }
      76%  { transform: scale(.96); }
      100% { transform: scale(1); }
    }
    @keyframes popup-spring-in {
      0%   { opacity: 0; transform: translateY(10px) scale(.90); }
      62%  { opacity: 1; transform: translateY(-2px) scale(1.025); }
      82%  { transform: translateY(1px) scale(.992); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popup-tip-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes airport-arrival-ring {
      0%   { opacity: .9; transform: scale(.55); }
      70%  { opacity: .28; }
      100% { opacity: 0; transform: scale(2.15); }
    }
    @keyframes airline-marker-enter {
      0%   { opacity: 0; transform: scale(.45); }
      58%  { opacity: 1; transform: scale(1.18); }
      78%  { transform: scale(.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes airline-marker-exit {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.68); }
    }
    @keyframes airport-selected-ring-in {
      0%   { opacity: 0; transform: scale(.55); }
      58%  { opacity: .95; transform: scale(1.15); }
      80%  { transform: scale(.97); }
      100% { opacity: .86; transform: scale(1); }
    }
    @keyframes picker-option-in {
      0%   { opacity: 0; transform: translateY(-5px) scale(.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .route-popup .leaflet-popup-content-wrapper,
      .route-popup .leaflet-popup-tip-container,
      .leaflet-overlay-pane svg path.airport-marker-spring,
      .leaflet-overlay-pane svg path.airport-arrival-ring,
      .leaflet-overlay-pane svg path.airline-marker-enter,
      .leaflet-overlay-pane svg path.airline-marker-exit,
      .leaflet-overlay-pane svg path.airport-selected-ring,
      #airline-picker-panel.open .picker-option {
        animation: none !important;
      }
    }
    .route-popup-shell { min-width: 170px; max-width: 240px; }
    .route-popup-header {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
    }
    .route-popup-iata { font-size: 24px; font-weight: 600; letter-spacing: 0.04em; }
    .route-popup-city { font-size: 13px; color: #86868b; }
    .route-popup-rows { display: flex; flex-direction: column; gap: 7px; }
    .route-popup-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .route-popup-key { font-size: 11px; color: #86868b; flex-shrink: 0; }
    .route-popup-val { font-size: 11px; font-weight: 500; color: #1d1d1f; text-align: right; line-height: 1.3; }
    .origin-pick-list { display: flex; flex-direction: column; gap: 6px; }
    .origin-pick-btn {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 8px 10px; border-radius: 10px; border: none;
      background: rgba(0,0,0,0.04); font-size: 12px; font-weight: 500;
      color: #1d1d1f; cursor: pointer; text-align: left;
    }
    .origin-pick-btn:hover { background: rgba(0,0,0,0.08); }

    /* Info card */
    #info-card {
      position: absolute; left: 24px; bottom: 24px; z-index: 20;
      width: 240px; max-width: 280px;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.16);
      padding: 14px 16px;
      opacity: 0;
      transform: translateY(6px) scale(0.98);
      transition: opacity 0.18s, transform 0.18s;
    }
    .card-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .card-iata { font-size: 24px; font-weight: 600; letter-spacing: 0.04em; }
    .card-city { font-size: 13px; color: #86868b; }
    .card-rows { display: flex; flex-direction: column; gap: 7px; }
    .card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-key { font-size: 11px; color: #86868b; flex-shrink: 0; }
    .card-val { font-size: 11px; font-weight: 500; color: #1d1d1f; text-align: right; line-height: 1.3; }

    @media (pointer: coarse) {
      #info-card {
        left: 12px;
        right: 12px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        width: auto;
        max-width: none;
      }
      /* 手機 header：改為兩行垂直堆疊 */
      #header {
        height: auto;
        min-height: unset;
        padding: calc(8px + env(safe-area-inset-top)) 10px 6px;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        justify-content: flex-start;
      }
      #header-left {
        width: 100%;
        gap: 0;
      }
      #header-right {
        width: 100%;
        display: flex;
        justify-content: flex-end;
      }
      /* 手機版：膠囊撐滿整行，選單改成推開版面的內嵌樣式（桌面版是浮動下拉） */
      #airline-picker { width: 100%; }
      #airline-chip { width: 100%; padding: 9px 12px; }
      .airline-chip-label { flex: 1; text-align: left; }
      #airline-picker-panel {
        position: static;
        margin-top: 6px;
        width: 100%;
        max-width: none;
        grid-template-columns: 1fr 1fr;
        background: rgba(255,255,255,0.92);
        box-shadow: none;
      }
      .picker-option { font-size: 11.5px; }
      /* stats 獨佔第二行，靠左排列 */
      #stats {
        width: 100%;
        justify-content: flex-start;
        gap: 10px;
        padding: 0 2px;
      }
      .stat-item { align-items: flex-start; }
      .stat-value { font-size: 13px; }
      .stat-sub { font-size: 9px; }
      #stat-name {
        font-size: 13px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }
      /* search 跟著 header 高度下移 */
      #search-wrap { top: var(--search-top, 110px); width: calc(100vw - 24px); max-width: 360px; }
      #zoom-ctrl {
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
      }
      .leaflet-tooltip { font-size: 11px !important; }
    }

    /* Header */
    #header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 25;
      min-height: 68px; display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 24px 10px;
      background: rgba(255,255,255,0.66);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
    }
    #header-left { display: flex; flex-direction: row; align-items: center; gap: 10px; flex-wrap: wrap; }
    #header-right {
      display: flex; align-items: center; justify-content: flex-end;
      margin-left: auto; gap: 10px; flex-wrap: wrap;
    }
    #page-links {
      display: flex; gap: 6px; flex-wrap: wrap;
      background: rgba(0,0,0,0.04);
      padding: 4px; border-radius: 12px;
      width: fit-content;
    }
    .page-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 9px; text-decoration: none;
      color: #1d1d1f; font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em; user-select: none;
      background: transparent; transition: background 0.15s, transform 0.15s;
    }
    .page-link:hover { background: rgba(255,255,255,0.8); transform: translateY(-1px); }
    .page-link.active { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    .page-link .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    #airline-picker { position: relative; }
    #airline-chip {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.06);
      border: none; border-radius: 10px;
      padding: 7px 14px;
      font-family: inherit; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #airline-chip:hover { background: rgba(0,0,0,0.1); }
    .airline-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .airline-chip-label { font-size: 13px; font-weight: 600; color: #1d1d1f; letter-spacing: 0.04em; white-space: nowrap; }
    .airline-chip-chevron { color: #86868b; transition: transform 0.2s; flex-shrink: 0; }
    #airline-chip.open .airline-chip-chevron { transform: rotate(180deg); }
    #airline-picker-panel {
      display: grid;
      position: absolute; top: calc(100% + 6px); left: 0;
      grid-template-columns: repeat(2, minmax(126px, 1fr));
      gap: 6px; width: max-content; max-width: 300px;
      padding: 8px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.16);
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px) scale(.96);
      transform-origin: 24px 0;
      transition:
        opacity 150ms ease-out,
        transform 360ms cubic-bezier(.18,1.25,.4,1),
        visibility 0s linear 360ms;
      will-change: opacity, transform;
    }
    #airline-picker-panel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }
    #airline-picker-panel.open .picker-option {
      animation: picker-option-in 280ms cubic-bezier(.22,1,.36,1) both;
      animation-delay: calc(var(--option-index, 0) * 24ms + 35ms);
    }
    .picker-option {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 9px; border-radius: 8px;
      border: 0.5px solid transparent;
      background: transparent;
      font-family: inherit; font-size: 12px; color: #1d1d1f;
      cursor: pointer; text-align: left;
      -webkit-appearance: none; appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .picker-option:hover { background: rgba(0,0,0,0.04); }
    .picker-option.active { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.08); font-weight: 600; }
    .picker-option-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .picker-option-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-option-check { color: #86868b; flex-shrink: 0; }

    @media (pointer: coarse) {
      #airline-picker-panel {
        position: static;
        top: auto;
        left: auto;
        width: 100%;
        max-width: none;
        max-height: 0;
        margin-top: 0;
        padding-top: 0;
        padding-bottom: 0;
        overflow: hidden;
        border-color: transparent;
        box-shadow: none;
        transform-origin: 50% 0;
        transition:
          max-height 390ms cubic-bezier(.22,1,.36,1),
          margin-top 260ms ease-out,
          padding 260ms ease-out,
          border-color 120ms ease-out,
          opacity 140ms ease-out,
          transform 360ms cubic-bezier(.18,1.25,.4,1),
          visibility 0s linear 390ms;
      }
      #airline-picker-panel.open {
        max-height: 320px;
        margin-top: 6px;
        padding: 8px;
        border-color: rgba(0,0,0,0.1);
        transition-delay: 0s;
      }
    }

    #stats { display: flex; align-items: center; gap: 20px; }
    .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-value { font-size: 16px; font-weight: 500; line-height: 1; }
    .stat-sub { font-size: 10px; color: #86868b; margin-top: 1px; }
    .stat-divider { width: 0.5px; height: 24px; background: rgba(0,0,0,0.12); }

    /* Search */
    #search-wrap {
      position: absolute; top: var(--search-top, 80px); left: 50%; transform: translateX(-50%);
      z-index: 20; width: 280px;
    }
    #search-inner { position: relative; }
    #search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      pointer-events: none;
    }
    #search-input {
      width: 100%; height: 36px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(0,0,0,0.15);
      border-radius: 10px; padding: 0 14px 0 36px;
      font-family: inherit; font-size: 13px; color: #1d1d1f; outline: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: border-color 0.2s;
    }
    #search-results {
      display: none;
      margin-top: 6px; background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(0,0,0,0.12); border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12); overflow: hidden;
    }
    .result-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 14px;
      cursor: pointer; transition: background 0.1s;
    }
    .result-iata { font-size: 12px; font-weight: 600; min-width: 32px; }
    .result-city { font-size: 13px; color: #1d1d1f; }
    .result-meta { margin-left: auto; font-size: 11px; color: #86868b; }

    /* Zoom */
    #zoom-ctrl {
      position: absolute; bottom: calc(32px + env(safe-area-inset-bottom)); right: 24px; z-index: 20;
      display: flex; flex-direction: column;
      border-radius: 10px; overflow: hidden;
      border: 0.5px solid rgba(0,0,0,0.12);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: bottom 0.3s;
    }
    .zoom-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; color: #1d1d1f;
      user-select: none; transition: background 0.15s; line-height: 1;
    }
    .zoom-btn:hover { background: rgba(0,0,0,0.05); }
    .zoom-btn.zoom-out { border-top: 0.5px solid rgba(0,0,0,0.1); }
    /* Feedback widget */
    .fb-fab {
      position: static;
      width: auto; min-width: 0;
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(29,29,31,0.92);
      color: #fff;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(0,0,0,0.12);
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      cursor: pointer; z-index: 30;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .fb-fab:hover {
      background: rgba(29,29,31,0.96);
      box-shadow: 0 4px 18px rgba(0,0,0,0.14);
      transform: translateY(-1px);
    }
    .fb-fab svg { display: block; flex-shrink: 0; }
    .fb-fab-label { display: inline-block; }
    @media (pointer: coarse) {
      .fb-fab {
        height: 32px;
        padding: 0 10px;
        font-size: 11px;
      }
      .fb-fab-label {
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
    .fb-overlay {
      position: fixed; inset: 0;
      background: rgba(29,29,31,0.35);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 40;
    }
    .fb-overlay.show { display: flex; }
    .fb-box {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      padding: 24px 24px 20px;
      width: min(400px, 90vw);
      box-shadow: 0 12px 40px rgba(0,0,0,0.16);
    }
    .fb-box h3 {
      margin: 0 0 16px;
      font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
      color: #1d1d1f;
    }
    .fb-box select, .fb-box textarea, .fb-box input {
      width: 100%;
      background: rgba(0,0,0,0.04);
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px; color: #1d1d1f;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      appearance: none; -webkit-appearance: none;
    }
    .fb-box select:focus, .fb-box textarea:focus, .fb-box input:focus {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.22);
    }
    .fb-box textarea { resize: none; height: 88px; line-height: 1.5; }
    .fb-box input::placeholder, .fb-box textarea::placeholder { color: #bbb; }
    .fb-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .fb-actions button {
      padding: 8px 16px;
      border-radius: 9px; border: none; cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;

    }
    .fb-actions button:active { transform: scale(0.97); }
    .fb-cancel-btn {
      background: rgba(0,0,0,0.06); color: #1d1d1f;
    }
    .fb-cancel-btn:hover { background: rgba(0,0,0,0.1); }
    #fb-send {
      background: #1d1d1f; color: #fff;
    }
    #fb-send:hover { opacity: 0.8; }
    .fb-star-row { display: flex; gap: 4px; margin-bottom: 8px; }
    .fb-star { font-size: 18px; cursor: pointer; color: #d1dce8; transition: color 0.1s; }
    .fb-star.active, .fb-star:hover { color: #f0b429; }
    .fb-star-hint {
      min-height: 14px; font-size: 11px; color: #86868b;

    /* ── Template C: Transparent Flight Deck ───────────────────────────── */
    :root {
      --deck-ink: #f6f8fb;
      --deck-muted: rgba(230,237,246,.66);
      --deck-panel: rgba(10,18,30,.72);
      --deck-panel-strong: rgba(8,15,26,.88);
      --deck-border: rgba(255,255,255,.14);
      --deck-highlight: rgba(255,255,255,.08);
      --deck-shadow: 0 18px 50px rgba(3,8,18,.30);
      --deck-radius: 18px;
    }
    body { background: #101722; }
    #map { background: #101722; }
    .leaflet-tile {
      filter: saturate(.58) brightness(.78) contrast(1.08) hue-rotate(4deg);
    }
    #map-shade {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(circle at 50% 44%, transparent 34%, rgba(4,10,18,.08) 68%, rgba(3,8,15,.28) 100%),
        linear-gradient(180deg, rgba(4,10,18,.22), transparent 26%, transparent 70%, rgba(4,10,18,.18));
    }
    #map-shade::after {
      content: ""; position: absolute; inset: 0; opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.65), transparent 48%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.65), transparent 48%);
    }

    /* Floating cockpit controls — no full-width toolbar */
    #header {
      top: calc(16px + env(safe-area-inset-top)); left: 16px; right: 16px;
      min-height: 0; padding: 0; background: transparent;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      border: 0; pointer-events: none;
      align-items: flex-start;
    }
    #header-left, #stats, #header-right { pointer-events: auto; }
    #header-left {
      gap: 10px; align-items: stretch;
      padding: 8px;
      border: 1px solid var(--deck-border);
      border-radius: var(--deck-radius);
      background: linear-gradient(145deg, rgba(15,25,42,.82), rgba(7,14,25,.66));
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      box-shadow: var(--deck-shadow), inset 0 1px 0 rgba(255,255,255,.06);
    }
    #cockpit-brand {
      min-width: 176px; padding: 5px 10px 5px 8px;
      display: flex; flex-direction: column; justify-content: center;
      border-right: 1px solid rgba(255,255,255,.10);
    }
    .cockpit-brand-kicker {
      color: var(--deck-muted); font-size: 9px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase; line-height: 1.1;
    }
    .cockpit-brand-title {
      color: var(--deck-ink); margin-top: 4px; font-size: 14px;
      font-weight: 650; letter-spacing: .015em; white-space: nowrap;
    }
    #airline-chip {
      min-height: 42px; border-radius: 12px; color: var(--deck-ink);
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08);
      transition: background 160ms ease, border-color 160ms ease, transform 160ms cubic-bezier(.22,1,.36,1);
    }
    #airline-chip:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.14); transform: translateY(-1px); }
    .airline-chip-label { color: var(--deck-ink); }
    .airline-chip-chevron { color: var(--deck-muted); }
    #airline-picker-panel {
      top: calc(100% + 12px); left: -8px;
      background: var(--deck-panel-strong); color: var(--deck-ink);
      border: 1px solid var(--deck-border); border-radius: 16px;
      box-shadow: 0 20px 60px rgba(2,7,16,.42), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
    }
    .picker-option { color: var(--deck-ink); }
    .picker-option:hover { background: rgba(255,255,255,.08); }
    .picker-option.active { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.10); }
    .picker-option-check { color: var(--deck-muted); }

    #stats {
      position: absolute; left: 50%; transform: translateX(-50%);
      padding: 9px 16px; min-width: 104px; justify-content: center;
      border: 1px solid var(--deck-border); border-radius: 999px;
      background: var(--deck-panel); backdrop-filter: blur(22px) saturate(145%);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
      box-shadow: 0 12px 34px rgba(3,8,18,.24), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .stat-item { align-items: center; }
    .stat-value { font-size: 15px; font-weight: 700; }
    .stat-sub { color: var(--deck-muted); font-size: 9px; letter-spacing: .08em; }

    #header-right { align-items: flex-start; }
    .fb-fab {
      height: 46px; padding: 0 15px; border-radius: 15px;
      border: 1px solid rgba(255,255,255,.16) !important;
      box-shadow: 0 14px 36px rgba(3,8,18,.28), inset 0 1px 0 rgba(255,255,255,.10);
    }

    /* Search becomes the central avionics command bar */
    #search-wrap {
      top: calc(82px + env(safe-area-inset-top)) !important;
      width: min(390px, calc(100vw - 32px)); z-index: 21;
    }
    #search-input {
      height: 44px; padding-left: 42px; color: var(--deck-ink);
      background: rgba(8,16,28,.76);
      border: 1px solid rgba(255,255,255,.15) !important;
      border-radius: 14px;
      box-shadow: 0 14px 38px rgba(3,8,18,.24), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      transition: transform 240ms cubic-bezier(.22,1,.36,1), background 180ms ease, border-color 180ms ease;
    }
    #search-input::placeholder { color: rgba(230,237,246,.52); }
    #search-input:focus { transform: translateY(-1px) scale(1.012); background: rgba(8,16,28,.90); }
    #search-icon circle, #search-icon path { stroke: rgba(230,237,246,.72); }
    #search-results {
      margin-top: 8px; color: var(--deck-ink);
      background: rgba(8,15,26,.92); border: 1px solid var(--deck-border);
      border-radius: 14px; box-shadow: 0 18px 48px rgba(2,7,16,.38);
    }
    .result-city { color: var(--deck-ink); }
    .result-meta { color: var(--deck-muted); }

    /* Route information becomes a bottom flight-deck drawer */
    #info-card {
      left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
      width: min(560px, calc(100vw - 120px)); max-width: 560px;
      transform: translate(-50%, 24px) scale(.98);
      padding: 14px 18px 16px;
      color: var(--deck-ink);
      background: linear-gradient(145deg, rgba(13,23,38,.90), rgba(7,14,25,.78));
      border: 1px solid var(--deck-border);
      border-radius: 20px;
      box-shadow: 0 22px 64px rgba(2,7,16,.42), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      transition: opacity 220ms ease, transform 460ms cubic-bezier(.18,1.22,.38,1);
    }
    #info-card::before {
      content: ""; display: block; width: 38px; height: 3px;
      margin: -2px auto 10px; border-radius: 99px; background: rgba(255,255,255,.22);
    }
    #info-card[style*='opacity: 1'], #info-card[style*='opacity:1'] {
      transform: translate(-50%, 0) scale(1) !important;
    }
    .drawer-kicker {
      color: var(--deck-muted); font-size: 9px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase; margin-bottom: 6px;
    }
    .card-header { margin-bottom: 12px; }
    .card-iata { color: var(--deck-ink); font-size: 27px; }
    .card-city { color: var(--deck-muted); }
    .card-rows { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 18px; }
    .card-row { padding-top: 7px; border-top: 1px solid rgba(255,255,255,.08); }
    .card-key { color: var(--deck-muted); }
    .card-val { color: var(--deck-ink); }

    /* Dark glass route popup; existing spring keyframes remain unchanged */
    .route-popup .leaflet-popup-content-wrapper {
      background: rgba(8,15,26,.90); border: 1px solid var(--deck-border);
      box-shadow: 0 18px 54px rgba(2,7,16,.42), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .route-popup .leaflet-popup-content { color: var(--deck-ink); }
    .route-popup .leaflet-popup-tip { background: rgba(8,15,26,.90); }
    .route-popup-city, .route-popup-key { color: var(--deck-muted); }
    .route-popup-iata, .route-popup-val { color: var(--deck-ink); }
    .origin-pick-btn { color: var(--deck-ink); background: rgba(255,255,255,.07); }
    .origin-pick-btn:hover { background: rgba(255,255,255,.12); }

    #zoom-ctrl {
      right: 18px; bottom: calc(22px + env(safe-area-inset-bottom));
      border: 1px solid var(--deck-border); border-radius: 14px;
      box-shadow: 0 14px 38px rgba(3,8,18,.26);
    }
    .zoom-btn { color: var(--deck-ink); background: rgba(8,16,28,.80); }
    .zoom-btn:hover { background: rgba(255,255,255,.13); }
    .zoom-btn.zoom-out { border-top-color: rgba(255,255,255,.10); }
    .leaflet-tooltip { color: rgba(240,244,249,.86) !important; text-shadow: 0 1px 4px rgba(0,0,0,.85); }

    @media (max-width: 860px), (pointer: coarse) {
      #header {
        top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px;
        flex-direction: row; align-items: flex-start; gap: 8px;
      }
      #header-left { width: auto; flex: 1; min-width: 0; padding: 6px; }
      #cockpit-brand { min-width: 0; width: 112px; padding-left: 6px; }
      .cockpit-brand-kicker { display: none; }
      .cockpit-brand-title { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
      #airline-picker { width: auto; flex: 1; min-width: 0; }
      #airline-chip { width: 100%; min-width: 0; padding: 8px 10px; }
      .airline-chip-label { overflow: hidden; text-overflow: ellipsis; }
      #airline-picker-panel {
        position: absolute; top: calc(100% + 10px); left: 0;
        width: min(330px, calc(100vw - 20px)); max-width: none;
        grid-template-columns: 1fr 1fr; margin-top: 0;
        box-shadow: 0 20px 56px rgba(2,7,16,.46);
      }
      #stats { display: none; }
      #header-right { width: auto; }
      .fb-fab { width: 44px; height: 44px; padding: 0; border-radius: 14px; }
      .fb-fab-label { display: none; }
      #search-wrap { top: calc(72px + env(safe-area-inset-top)) !important; }
      #info-card {
        left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
        width: auto; max-width: none;
        z-index: 24; /* 手機版航點資訊優先顯示於縮放控制上方 */
        pointer-events: none; /* 隱藏時不阻擋縮放按鈕 */
        transform: translateY(24px) scale(.98);
      }
      #info-card[style*='opacity: 1'], #info-card[style*='opacity:1'] {
        transform: translateY(0) scale(1) !important;
        pointer-events: auto;
      }
      .card-rows { grid-template-columns: 1fr; gap: 6px; }
      #zoom-ctrl {
        right: 10px; bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 19; /* 航點資訊展開時退到其下層 */
      }
    }


    /* ── Route Filters v1 ─────────────────────────────────────────────── */
    #filter-bar {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px; pointer-events: auto;
    }
    #filter-trigger {
      height: 34px; padding: 0 12px; border-radius: 11px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      color: var(--deck-ink); background: rgba(8,16,28,.76);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 28px rgba(3,8,18,.20), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(20px) saturate(145%);
      -webkit-backdrop-filter: blur(20px) saturate(145%);
      font: 650 11px/1 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      letter-spacing: .03em; cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: transform 180ms cubic-bezier(.22,1,.36,1), background 160ms ease, border-color 160ms ease;
    }
    #filter-trigger:hover { transform: translateY(-1px); background: rgba(16,27,44,.90); border-color: rgba(255,255,255,.22); }
    #filter-trigger:active { transform: scale(.96); }
    #filter-trigger.is-active { border-color: var(--filter-accent, rgba(255,255,255,.28)); }
    #filter-trigger svg { flex: 0 0 auto; }
    #filter-count-badge {
      min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; background: var(--filter-accent, #5b9bd5);
      font-size: 9px; font-weight: 750;
    }
    #filter-result-summary {
      height: 34px; padding: 0 11px; border-radius: 11px;
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--deck-muted); background: rgba(8,16,28,.58);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      font-size: 10px; white-space: nowrap;
    }
    #filter-result-summary strong { color: var(--deck-ink); font-size: 11px; }

    #filter-backdrop {
      position: fixed; inset: 0; z-index: 34; display: none;
      background: rgba(2,7,16,.48); opacity: 0; pointer-events: none;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      transition: opacity 220ms ease;
    }
    #filter-panel {
      position: fixed; z-index: 35; left: 50%; top: 150px;
      width: min(410px, calc(100vw - 28px)); max-height: min(620px, calc(100dvh - 180px));
      display: flex; flex-direction: column; overflow: hidden;
      color: var(--deck-ink);
      background: linear-gradient(145deg, rgba(13,23,38,.96), rgba(7,14,25,.92));
      border: 1px solid var(--deck-border); border-radius: 20px;
      box-shadow: 0 24px 70px rgba(2,7,16,.52), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translate(-50%, -10px) scale(.975);
      transform-origin: 50% 0;
      transition: opacity 180ms ease, visibility 0s linear 220ms, transform 380ms cubic-bezier(.18,1.18,.38,1);
    }
    #filter-panel.open {
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
      transition-delay: 0s;
    }
    .filter-sheet-handle { display: none; }
    .filter-panel-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 17px 13px; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .filter-title-wrap { min-width: 0; }
    .filter-eyebrow {
      color: var(--deck-muted); font-size: 8px; font-weight: 750;
      letter-spacing: .17em; text-transform: uppercase;
    }
    .filter-title { margin-top: 4px; font-size: 15px; font-weight: 700; letter-spacing: .01em; }
    .filter-close {
      width: 32px; height: 32px; border: 0; border-radius: 10px;
      display: grid; place-items: center; flex: 0 0 auto;
      color: var(--deck-muted); background: rgba(255,255,255,.07); cursor: pointer;
      transition: transform 160ms cubic-bezier(.22,1,.36,1), background 150ms ease;
    }
    .filter-close:hover { color: var(--deck-ink); background: rgba(255,255,255,.12); transform: rotate(3deg) scale(1.04); }
    #filter-groups { overflow: auto; padding: 4px 17px 12px; overscroll-behavior: contain; }
    .filter-group { padding: 14px 0 13px; border-bottom: 1px solid rgba(255,255,255,.075); }
    .filter-group:last-child { border-bottom: 0; }
    .filter-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .filter-group-title { font-size: 12px; font-weight: 700; }
    .filter-group-note { color: var(--deck-muted); font-size: 9px; }
    .filter-chip-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-chip {
      min-height: 31px; padding: 0 10px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(238,243,249,.78); background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08); cursor: pointer;
      font: 600 10px/1 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: transform 170ms cubic-bezier(.22,1,.36,1), background 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .filter-chip:hover { transform: translateY(-1px); color: var(--deck-ink); background: rgba(255,255,255,.09); }
    .filter-chip:active { transform: scale(.95); }
    .filter-chip.active {
      color: #fff; background: rgba(91,155,213,.24);
      border-color: var(--filter-accent, #5b9bd5);
      background: color-mix(in srgb, var(--filter-accent, #5b9bd5) 32%, rgba(255,255,255,.07));
      border-color: color-mix(in srgb, var(--filter-accent, #5b9bd5) 72%, transparent);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .filter-chip-count { color: var(--deck-muted); font-size: 8px; }
    .filter-chip.active .filter-chip-count { color: rgba(255,255,255,.72); }
    .filter-panel-footer {
      padding: 12px 17px calc(12px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-top: 1px solid rgba(255,255,255,.08); background: rgba(5,11,20,.54);
    }
    .filter-footer-result { color: var(--deck-muted); font-size: 10px; line-height: 1.35; }
    .filter-footer-result strong { display: block; color: var(--deck-ink); font-size: 13px; }
    #filter-reset {
      min-height: 34px; padding: 0 13px; border-radius: 11px;
      color: var(--deck-ink); background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10); cursor: pointer;
      font-size: 10px; font-weight: 700;
    }
    #filter-empty {
      display: none; padding: 10px 12px; margin-top: 10px; border-radius: 11px;
      color: #ffd7d7; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.18);
      font-size: 10px; line-height: 1.4;
    }
    #filter-empty.show { display: block; }

    @media (max-width: 860px), (pointer: coarse) {
      #filter-bar { margin-top: 7px; }
      #filter-trigger, #filter-result-summary { height: 32px; }
      #filter-trigger { padding: 0 11px; }
      #filter-result-summary { max-width: 135px; overflow: hidden; text-overflow: ellipsis; }
      #filter-backdrop { display: block; }
      #filter-backdrop.open { opacity: 1; pointer-events: auto; }
      #filter-panel {
        left: 0; right: 0; top: auto !important; bottom: 0; width: 100%;
        max-height: min(78dvh, 680px); border-radius: 24px 24px 0 0;
        transform: translateY(104%); transform-origin: 50% 100%;
        opacity: 1; visibility: visible;
        transition: transform 460ms cubic-bezier(.18,1.08,.36,1), box-shadow 220ms ease;
      }
      #filter-panel.open { transform: translateY(0); }
      .filter-sheet-handle {
        display: block; width: 42px; height: 4px; margin: 9px auto 0;
        border-radius: 999px; background: rgba(255,255,255,.22);
      }
      .filter-panel-header { padding-top: 10px; }
      #filter-groups { padding-left: 15px; padding-right: 15px; }
      .filter-panel-footer { padding-left: 15px; padding-right: 15px; }
      .filter-chip { min-height: 34px; padding: 0 11px; font-size: 11px; }
      body.filter-open #map { pointer-events: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #filter-panel, #filter-backdrop, #filter-trigger, .filter-chip { transition-duration: 0.01ms !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      #search-input, #info-card, #airline-chip { transition-duration: 0.01ms !important; }
    }

  
    /* Cross-airline destination search */
    #search-results { max-height: min(58vh, 430px); overflow-y: auto; }
    .global-result-item {
      display: grid; grid-template-columns: 42px minmax(0,1fr) auto;
      align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      transition: background .16s ease, transform .16s ease;
    }
    .global-result-item:last-child { border-bottom: 0; }
    .global-result-item:hover { background: rgba(255,255,255,0.07); }
    .global-airline-code {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 38px; height: 28px; border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--airline-color) 55%, transparent);
      background: color-mix(in srgb, var(--airline-color) 18%, transparent);
      color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    }
    .global-result-main { min-width: 0; }
    .global-result-route {
      display: flex; align-items: baseline; gap: 7px; min-width: 0;
      color: #f7f9fc; font-size: 12px; font-weight: 650;
    }
    .global-result-city {
      color: rgba(230,237,246,.62); font-size: 10px; font-weight: 500;

    /* Achievement toast */

    #achievement-confetti {
      position: fixed; inset: 0; z-index: 2050; overflow: hidden;

    .achievement-confetti-piece {
      position: absolute; top: -10vh; left: 0;

    }
    @keyframes achievement-confetti-fall {

<body>
<div id="app">

<script>
let map = null;
let headerResizeObserver = null;
let headerResizeFrame = null;

function syncHeaderOffset() {
  const header = document.getElementById("header");
  if (!header) return;
  const searchTop = Math.ceil(header.getBoundingClientRect().height + 12);
  document.documentElement.style.setProperty("--search-top", `${searchTop}px`);
}
function syncLayoutVars() {
  const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-height", `${Math.round(viewportHeight)}px`);
  syncHeaderOffset();
  if (map) {
    window.requestAnimationFrame(() => map.invalidateSize());
  }
}
syncLayoutVars();
window.addEventListener("resize", syncLayoutVars);
window.addEventListener("orientationchange", syncLayoutVars);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncLayoutVars);
  window.visualViewport.addEventListener("scroll", syncLayoutVars);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0]-a[0])*r, dLon = (b[1]-a[1])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}
const LEFT_SIDE_AIRPORTS = new Set(["ACC", "MAD", "LHR", "LGW", "DUB", "LIS", "AGP", "MAN", "CMN"]);

function bezierArc(s, e, preferLeftSide = false) {
  let eLng = e[1];

function animateRouteDraw(line, d, id) {
  if (prefersReducedMotion || !line) return;
  const path = line.getElement();
  if (!path || typeof path.getTotalLength !== "function") return;

  const token = ++routeAnimationToken;
  const length = Math.max(1, Math.ceil(path.getTotalLength()));
  path.classList.add("route-line-drawing");
  path.style.transition = "none";
  path.style.strokeDasharray = `${length} ${length}`;
  path.style.strokeDashoffset = `${length}`;
  path.style.opacity = "0.12";
  void path.getBoundingClientRect();

  window.requestAnimationFrame(() => {
    window.requestAnimationFrame(() => {
      if (token !== routeAnimationToken) return;
      path.style.transition = "stroke-dashoffset 780ms cubic-bezier(.22,1,.36,1), opacity 180ms ease-out";
      path.style.strokeDashoffset = "0";

  // Very rough block-time estimate: cruise + taxi/takeoff/landing overhead.

    cruiseSpeed = 720;
    overheadMinutes = 25;
  } else if (distanceKm < 3000) {
    cruiseSpeed = 790;
    overheadMinutes = 30;
  } else if (distanceKm < 6000) {
    cruiseSpeed = 830;
    overheadMinutes = 35;

  const totalMinutes = Math.round(distanceKm / cruiseSpeed * 60 + overheadMinutes);

}
function updateFilterSummary() {
  const filtered = getFilteredRoutes();
  const destinationCount = new Set(filtered.map(d => d.iata)).size;
  const groupCount = countActiveFilterGroups();
  const badge = document.getElementById("filter-count-badge");
  const trigger = document.getElementById("filter-trigger");
  const resultCount = document.getElementById("filter-result-count");
  const footerCount = document.getElementById("filter-footer-count");
  const footerDest = document.getElementById("filter-footer-dest");
  const empty = document.getElementById("filter-empty");
  if (badge) { badge.textContent = String(groupCount); badge.hidden = groupCount === 0; }
  if (trigger) trigger.classList.toggle("is-active", groupCount > 0);
  if (resultCount) resultCount.textContent = String(filtered.length);
  if (footerCount) footerCount.textContent = `${filtered.length} 條航線`;
  if (footerDest) footerDest.textContent = `${destinationCount} 個航點`;
  if (empty) empty.classList.toggle("show", filtered.length === 0);
}
function toggleRouteFilter(group, value) {
  const set = routeFilters[group];
  if (!(set instanceof Set)) return;
  if (value === "__ALL__") {
    set.clear();
  } else if (set.size === 0) {
    set.add(value);
  } else if (set.has(value)) {
    set.delete(value);
  } else {
    set.add(value);
  }
  applyRouteFilters();
}
function resetRouteFilters(options = {}) {
  routeFilters.origins.clear();
  routeFilters.regions.clear();
  routeFilters.statuses.clear();
  DEFAULT_ROUTE_STATUSES.forEach(v => routeFilters.statuses.add(v));
  if (!options.skipApply) applyRouteFilters();
}
function clearActiveAirlineLayers(id) {
  Object.values(layers[id] || {}).forEach(route => {
    if (map.hasLayer(route.hit)) map.removeLayer(route.hit);
    if (map.hasLayer(route.marker)) map.removeLayer(route.marker);
  });
  Object.keys(hubMarkers).forEach(key => {
    if (key.startsWith(`${id}_`) && map.hasLayer(hubMarkers[key])) map.removeLayer(hubMarkers[key]);
  });
}

function positionFilterPanel() {

function showAirline(id) {
  const al = getFilteredRoutes(id);
  const meta = AIRLINE_META_INFO[id] || {};
  const otherIDs = AIRLINE_IDS.filter(x => x !== id);

  // Fade/scale previous airline out. Removal is delayed briefly so the transition is visible.
  otherIDs.forEach(otherID => {
    Object.values(layers[otherID]).forEach(route => hideRouteWithTransition(route, otherID));
    Object.keys(hubMarkers).forEach(k => {
      if (k.startsWith(`${otherID}_`)) hideHubWithTransition(hubMarkers[k], otherID);
    });
  });

  // Enter from near to far, so the network appears to expand from each route's hub.
  const orderedRoutes = al
    .map(d => {
      const hub = HUB_COORDS[d.origin] || meta.hubCoords || HUB_COORDS.TPE;
      return { d, distance: haversine(hub, d.coords) };
    })
    .sort((a, b) => a.distance - b.distance);

  orderedRoutes.forEach(({ d }, index) => {
    const route = layers[id][routeKey(d)];
    if (!route) return; // 資料缺漏時安全跳過，避免整個畫面壞掉

    if (!map.hasLayer(route.marker)) route.marker.addTo(map);
    if (!map.hasLayer(route.hit)) route.hit.addTo(map);
    const markerPath = route.marker.getElement && route.marker.getElement();
    if (markerPath) markerPath.classList.remove("airline-marker-exit");
    animateLayerEnter(route.marker, Math.min(index * (isTouchDevice ? 20 : 28), isTouchDevice ? 380 : 520));

    route.hit.off("mouseover").off("mouseout").off("click").off("touchstart").off("touchend").off("pointerdown").off("pointerup").off("tap");
    // Desktop: click handler
    route.hit.on("click", (e) => {
      if (mapWasDragged) { mapWasDragged = false; return; }
      L.DomEvent.stopPropagation(e);
      handleMarkerClick(d, id);
    });
    // iOS/touch: use touchend to avoid preventDefault blocking synthetic click.
    let touchMoved = false;
    route.hit.on("touchstart", (e) => {
      touchMoved = false;
      L.DomEvent.stopPropagation(e);
    });
    route.hit.on("touchmove", () => { touchMoved = true; });
    route.hit.on("touchend", (e) => {
      if (touchMoved || mapWasDragged) { mapWasDragged = false; return; }
      L.DomEvent.stopPropagation(e);
      handleMarkerClick(d, id);
    });
  });

  const hubMarker = hubMarkers[`${id}_${meta.hub}`];
  if (hubMarker && !map.hasLayer(hubMarker)) hubMarker.addTo(map);
  if (id === "BR") {
    const hasTsaRoutes = al.some(d => d.origin === "TSA" || d.origin === "BOTH");
    if (hasTsaRoutes && hubMarkers["BR_TSA"] && !map.hasLayer(hubMarkers["BR_TSA"])) hubMarkers["BR_TSA"].addTo(map);
    const hasKhhRoutes = al.some(d => d.origin === "KHH");
    if (hasKhhRoutes && hubMarkers["BR_KHH"] && !map.hasLayer(hubMarkers["BR_KHH"])) hubMarkers["BR_KHH"].addTo(map);
  }
  if (id === "JX") {
    const hasRmqRoutes = al.some(d => d.origin === "RMQ");
    if (hasRmqRoutes && hubMarkers["JX_RMQ"] && !map.hasLayer(hubMarkers["JX_RMQ"])) hubMarkers["JX_RMQ"].addTo(map);
  }
  if (id === "IT") {
    const hasTnnRoutes = al.some(d => d.origin === "TNN");
    if (hasTnnRoutes && hubMarkers["IT_TNN"] && !map.hasLayer(hubMarkers["IT_TNN"])) hubMarkers["IT_TNN"].addTo(map);
  }
  if (id === "MF") {
    ["FOC","HGH"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`MF_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "MU") {
    ["SHA","NKG","NGB","WUH","TAO","TFU","KMG","XIY","PKX"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`MU_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "KE") {
    ["GMP","CJU","PUS"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`KE_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "GK") {
    ["KIX","NGO","FUK"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`GK_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "CI") {
    ["TSA","KHH","RMQ"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`CI_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }

  Object.keys(hubMarkers).forEach(k => {
    if (!k.startsWith(`${id}_`)) return;
    const marker = hubMarkers[k];
    if (map.hasLayer(marker)) {
      const path = marker.getElement && marker.getElement();
      if (path) path.classList.remove("airline-marker-exit");
      animateLayerEnter(marker, 0);
    }
  });
}

function switchAirline(id) {
  // 新增：追蹤切換航空公司標籤事件
  gtag('event', 'switch_airline', {
    'airline_id': id
  });

  if (id === activeAirline) return;
  closeRoutePopup();
  hideInfoCard();
  clearSelectedAirport();
  closeFilterPanel();
  activeAirline = id;
  resetRouteFilters({ skipApply: true });
  showAirline(id);
  updateUI();

  // 航點搜尋固定涵蓋所有航空公司；切換地圖航司時保留查詢與結果。
  const search = document.getElementById("search-input");
  if (search && search.value.trim()) onSearch(search.value);
}

function updateUI() {
  const al = getFilteredRoutes(activeAirline);
  const meta = AIRLINE_META_INFO[activeAirline] || {};

  // 膠囊按鈕 + 展開選單（桌面／手機通用）
  updateAirlinePicker();

  // Stats — 已停飛（SUSPENDED）及尚未開航（SCHEDULED）航線不計入目的地數量，避免誤導
  const activeDestCount = new Set(al.map(d => d.iata)).size;
  document.getElementById("stat-dest").textContent = activeDestCount;
  document.getElementById("stat-dest").style.color = meta.color || "#000";

  // Search border color
  document.getElementById("search-input").style.borderColor = "rgba(0,0,0,0.15)";

  // Sync feedback widget color/text with active airline
  const fbFab = document.getElementById('fb-fab');
  const fbSend = document.getElementById('fb-send');
  if (fbFab) {
    fbFab.style.background = meta.color || '#2d6bc4';
    fbFab.style.color = '#fff';
    fbFab.title = `回報 · ${meta.fullName || ''}`;
  }
  if (fbSend) {
    fbSend.style.background = meta.color || '#2d6bc4';
    fbSend.style.color = '#fff';
    fbSend.style.borderColor = meta.color || '#2d6bc4';
  }
  document.documentElement.style.setProperty('--filter-accent', meta.color || '#5b9bd5');
  updateFilterSummary();

}

  chipDot.style.background = meta.color || "#999";

  const panel = document.getElementById("airline-picker-panel");
  panel.innerHTML = AIRLINE_IDS.map((id, index) => {
    const a = AIRLINE_META_INFO[id] || {};

function defaultAchievementState() {
  return {
    version: 2,
    visitedAirports: [],
    visitedAirlines: [],
    achievements: Object.fromEntries(ACHIEVEMENT_DEFINITIONS.map(item => [
      item.id, { unlocked: false, unlockedAt: null }
    ]))
  };
}

function normalizeAchievementState(saved) {
  const state = defaultAchievementState();
  if (!saved || typeof saved !== "object") return state;

  // v1 只儲存日本初心者的 airports；升級後沿用既有探索紀錄。
  const legacyAirports = Array.isArray(saved.japanBeginner?.airports)
    ? saved.japanBeginner.airports : [];
  const savedAirports = Array.isArray(saved.visitedAirports) ? saved.visitedAirports : [];
  state.visitedAirports = [...new Set([...legacyAirports, ...savedAirports]
    .map(value => String(value).toUpperCase()))];
  state.visitedAirlines = [...new Set((Array.isArray(saved.visitedAirlines)
    ? saved.visitedAirlines : []).map(value => String(value).toUpperCase()))];

  ACHIEVEMENT_DEFINITIONS.forEach(item => {
    const record = saved.achievements?.[item.id];
    if (record) {
      state.achievements[item.id] = {
        unlocked: Boolean(record.unlocked),
        unlockedAt: record.unlockedAt || null
      };
    }
  });
  if (saved.japanBeginner?.unlocked) {
    state.achievements.japanBeginner = {
      unlocked: true,
      unlockedAt: saved.japanBeginner.unlockedAt || null
    };
  }
  return state;
}

function loadAchievementState() {
  try {
    const raw = localStorage.getItem(ACHIEVEMENT_STORAGE_KEY);
    if (!raw) return defaultAchievementState();
    return normalizeAchievementState(JSON.parse(raw));
  } catch (error) {
    console.warn("Achievement data could not be loaded.", error);
    return defaultAchievementState();
  }
}

function saveAchievementState(state) {
  try {
    localStorage.setItem(ACHIEVEMENT_STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn("Achievement data could not be saved.", error);
  }
}

function achievementDescription(definition) {

    europeRomance: "探索巴黎 CDG、維也納 VIE、羅馬 FCO。"

  return descriptions[definition.id] || "完成指定的航線探索條件。";

function achievementGalleryProgressText(definition, progress) {
  if (definition.type === "asiaExplorer") {
    return `${progress.count}/${progress.target} 航點 · ${progress.countryCount}/${progress.countryTarget} 地區`;
  }
  if (definition.type === "airlines") return `${progress.count}/${progress.target} 家航司`;
  return `${progress.count}/${progress.target} 個航點`;
}

function achievementGalleryProgressRatio(definition, progress) {
  if (definition.type === "asiaExplorer") {
    return Math.min(
      progress.count / progress.target,
      progress.countryCount / progress.countryTarget,
      1
    );
  }
  return Math.min(progress.count / progress.target, 1);
}

function formatAchievementDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return new Intl.DateTimeFormat("zh-TW", {
    year: "numeric", month: "short", day: "numeric"
  }).format(date);
}

function reconcileAchievementState(state) {
  let changed = false;
  ACHIEVEMENT_DEFINITIONS.forEach(definition => {
    const record = state.achievements[definition.id];
    if (!record.unlocked && achievementProgress(definition, state).complete) {
      record.unlocked = true;
      record.unlockedAt = new Date().toISOString();
      changed = true;
    }
  });
  if (changed) saveAchievementState(state);
  return state;
}

function refreshAchievementGalleryButton(state = null) {
  const count = document.getElementById("achievement-gallery-button-count");
  if (!count) return;
  const current = state || loadAchievementState();
  const unlocked = ACHIEVEMENT_DEFINITIONS.filter(item => current.achievements[item.id]?.unlocked).length;
  count.textContent = `${unlocked}/${ACHIEVEMENT_DEFINITIONS.length}`;
}

function renderAchievementGallery() {
  const grid = document.getElementById("achievement-gallery-grid");
  const summary = document.getElementById("achievement-gallery-summary");
  if (!grid || !summary) return;
  const state = reconcileAchievementState(loadAchievementState());
  const unlockedCount = ACHIEVEMENT_DEFINITIONS.filter(item => state.achievements[item.id]?.unlocked).length;
  summary.innerHTML = `<strong>${unlockedCount}/${ACHIEVEMENT_DEFINITIONS.length}</strong> 枚徽章已解鎖 · 點選航點即可累積探索進度`;
  refreshAchievementGalleryButton(state);

  grid.innerHTML = ACHIEVEMENT_DEFINITIONS.map(definition => {
    const record = state.achievements[definition.id];
    const progress = achievementProgress(definition, state);
    const unlocked = Boolean(record.unlocked);
    const concealed = Boolean(definition.hidden && !unlocked);
    const ratio = Math.round(achievementGalleryProgressRatio(definition, progress) * 100);
    const date = formatAchievementDate(record.unlockedAt);
    const badgeMarkup = concealed
      ? `<span class="achievement-gallery-image-fallback" aria-hidden="true">?</span>`
      : `<img src="${definition.badge}" alt="${definition.title}徽章"
          onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <span class="achievement-gallery-image-fallback" aria-hidden="true">${definition.code}</span>`;
    const status = concealed ? "SECRET ACHIEVEMENT" : (unlocked ? "ACHIEVEMENT UNLOCKED" : "CHALLENGE IN PROGRESS");
    const difficulty = definition.difficulty ? ` · ${definition.difficulty}` : "";
    const progressText = concealed ? "隱藏條件尚未揭曉" : achievementGalleryProgressText(definition, progress);
    return `<article class="achievement-gallery-card ${unlocked ? "unlocked" : "locked"} ${concealed ? "secret" : ""}">
      <div class="achievement-gallery-badge">
        ${badgeMarkup}
      </div>
      <div class="achievement-gallery-status">${status}${difficulty}</div>
      <h3>${concealed ? "？？？" : definition.title}</h3>
      <p class="achievement-gallery-description">${concealed ? definition.hiddenHint : achievementDescription(definition)}</p>
      <div class="achievement-gallery-progress-row"><span>${progressText}</span><span>${concealed ? "?" : `${ratio}%`}</span></div>
      <div class="achievement-gallery-progress" aria-label="${concealed ? "隱藏進度" : `完成度 ${ratio}%`}"><span style="width:${concealed ? 0 : ratio}%"></span></div>
      <div class="achievement-gallery-date">${unlocked ? (date ? `解鎖於 ${date}` : "已解鎖") : "尚未解鎖"}</div>
    </article>`;
  }).join("");
}

window.addEventListener("keydown", event => {
  const overlay = document.getElementById("achievement-gallery-overlay");
  if (!overlay?.classList.contains("show")) return;

  if (event.key === "Escape") {
    event.preventDefault();
    closeAchievementGallery();
    return;
  }

  if (event.key !== "Tab") return;
  const focusable = [...overlay.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )].filter(element => !element.hidden && element.getAttribute("aria-hidden") !== "true" && element.offsetParent !== null);
  if (!focusable.length) return;

  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  const active = document.activeElement;
  if (!overlay.contains(active)) {
    event.preventDefault();
    (event.shiftKey ? last : first).focus();
  } else if (event.shiftKey && active === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  }
});

function rareAirportCodes(maxAirlines) {
  const airlineSets = new Map();
  AIRLINE_IDS.forEach(id => {
    (AIRLINES[id] || []).forEach(route => {
      if (!route.iata) return;
      const iata = String(route.iata).toUpperCase();
      if (!airlineSets.has(iata)) airlineSets.set(iata, new Set());
      airlineSets.get(iata).add(id);
    });
  });
  return new Set([...airlineSets.entries()]
    .filter(([, airlines]) => airlines.size <= maxAirlines)
    .map(([iata]) => iata));
}

function achievementProgress(definition, state) {
  const airports = state.visitedAirports;
  if (definition.type === "regionAirports") {
    const count = airports.filter(iata => AIRPORT_MASTER[iata]?.region === definition.region).length;
    return { complete: count >= definition.target, count, target: definition.target };
  }
  if (definition.type === "airlines") {
    const count = state.visitedAirlines.length;
    return { complete: count >= definition.target, count, target: definition.target };
  }
  if (definition.type === "asiaExplorer") {
    const asiaAirports = airports.filter(iata => ASIA_ACHIEVEMENT_REGIONS.has(AIRPORT_MASTER[iata]?.region));
    const countries = new Set(asiaAirports.map(iata => AIRPORT_MASTER[iata]?.country).filter(Boolean));
    return {
      complete: asiaAirports.length >= definition.airportTarget && countries.size >= definition.countryTarget,
      count: asiaAirports.length,
      target: definition.airportTarget,
      countryCount: countries.size,
      countryTarget: definition.countryTarget
    };
  }
  if (definition.type === "rareAirports") {
    const rare = rareAirportCodes(definition.maxAirlines);
    const count = airports.filter(iata => rare.has(iata)).length;
    return { complete: count >= definition.target, count, target: definition.target };
  }
  if (definition.type === "requiredAirports") {
    const required = definition.airports || [];
    const count = required.filter(iata => airports.includes(iata)).length;
    return { complete: count >= required.length, count, target: required.length };
  }
  return { complete: false, count: 0, target: 1 };
}

function achievementDetail(definition, progress, justUnlocked) {
  if (justUnlocked) return `達成條件，成功解鎖「${definition.title}」徽章！`;
  if (definition.type === "asiaExplorer") {
    return `已探索 ${progress.count}/${progress.target} 個亞洲航點，涵蓋 ${progress.countryCount}/${progress.countryTarget} 個國家或地區。`;
  }
  const unit = definition.type === "airlines" ? "家航空公司" : "個不同航點";
  return `目前已探索 ${progress.count}/${progress.target} ${unit}。`;
}

function setAchievementBadge(definition) {
  const seal = document.getElementById("achievement-seal");
  const badge = document.getElementById("achievement-badge");

  badge.onload = () => seal.classList.add("has-badge");

function launchAchievementConfetti() {
  if (prefersReducedMotion) return;

  const colors = ["#f0c252", "#ff6577", "#58c8ff", "#76df9b", "#b994ff", "#ffffff"];

function showNextAchievementToast() {
  if (achievementToastVisible || !achievementToastQueue.length) return;
  const { definition, progress, justUnlocked } = achievementToastQueue.shift();
  const toast = document.getElementById("achievement-toast");
  if (!toast) return;
  achievementToastVisible = true;
  setAchievementBadge(definition);
  document.getElementById("achievement-count").textContent = definition.type === "asiaExplorer"
    ? `${Math.min(progress.count, progress.target)}/${progress.target} 航點 · ${Math.min(progress.countryCount, progress.countryTarget)}/${progress.countryTarget} 地區`
    : `${Math.min(progress.count, progress.target)}/${progress.target}`;
  document.getElementById("achievement-kicker").textContent = justUnlocked ? "Achievement unlocked" : "Challenge progress";
  document.getElementById("achievement-title").textContent = definition.title;
  document.getElementById("achievement-detail").textContent = achievementDetail(definition, progress, justUnlocked);
  toast.classList.toggle("unlocked", justUnlocked);
  toast.classList.add("show");
  toast.setAttribute("aria-hidden", "false");
  if (justUnlocked) launchAchievementConfetti();
  if (achievementToastTimer) window.clearTimeout(achievementToastTimer);
  achievementToastTimer = window.setTimeout(closeAchievementToast, justUnlocked ? 6500 : 3000);
}

function queueAchievementToast(definition, progress, justUnlocked = false) {
  achievementToastQueue.push({ definition, progress, justUnlocked });
  showNextAchievementToast();
}

function trackAirportAchievements(d, airlineId) {
  if (!d?.iata) return;
  const state = loadAchievementState();
  const iata = String(d.iata).toUpperCase();
  const id = String(airlineId || d.airline || "").toUpperCase();
  const isNewAirport = !state.visitedAirports.includes(iata);
  const isNewAirline = id && !state.visitedAirlines.includes(id);
  if (!isNewAirport && !isNewAirline) return;

  // 同一機場由不同航空公司或出發地進入時，只計算一次。
  if (isNewAirport) state.visitedAirports.push(iata);
  if (isNewAirline) state.visitedAirlines.push(id);

  const newlyUnlocked = [];
  ACHIEVEMENT_DEFINITIONS.forEach(definition => {
    const progress = achievementProgress(definition, state);
    const record = state.achievements[definition.id];
    if (progress.complete && !record.unlocked) {
      record.unlocked = true;
      record.unlockedAt = new Date().toISOString();
      newlyUnlocked.push({ definition, progress });
    }
  });
  saveAchievementState(state);
  refreshAchievementGalleryButton(state);

  if (newlyUnlocked.length) {
    newlyUnlocked.forEach(item => queueAchievementToast(item.definition, item.progress, true));
  }
}

  const option = ROUTE_STATUS_OPTIONS.find(x => x.value === key);

}

function getGlobalSearchHits(value) {
  const q = value.trim().toLowerCase();
  if (!q) return [];
  const rows = [];
  // 搜尋範圍刻意不使用 activeAirline 或 routeFilters，確保永遠查詢全部航司。
  AIRLINE_IDS.forEach(id => {
    (AIRLINES[id] || []).forEach(d => {
      const iata = String(d.iata || "").toLowerCase();
      const city = String(d.city || "").toLowerCase();
      const airportName = String(d.airportName || "").toLowerCase();
      if (iata.includes(q) || city.includes(q) || airportName.includes(q)) {
        rows.push({ id, d, exact: iata === q ? 0 : 1 });
      }
    });
  });
  return rows.sort((a, b) =>
    a.exact - b.exact ||
    a.d.iata.localeCompare(b.d.iata) ||
    AIRLINE_IDS.indexOf(a.id) - AIRLINE_IDS.indexOf(b.id) ||
    String(a.d.origin || "").localeCompare(String(b.d.origin || ""))
  );
}

function onSearch(val) {
  const input = document.getElementById("search-input");
  const resultsEl = document.getElementById("search-results");
  const q = val.trim();

  if (!q) {
    resultsEl.style.display = "none";
    input.style.borderColor = "rgba(255,255,255,0.15)";
    return;
  }

  input.style.borderColor = "rgba(255,255,255,0.34)";
  const hits = getGlobalSearchHits(q);
  if (hits.length === 0) {
    resultsEl.innerHTML = `<div class="global-search-empty">找不到符合「${q.replace(/[<>]/g, "")}」的航線</div>`;
    resultsEl.style.display = "block";
    return;
  }

  resultsEl.innerHTML = hits.map(({ id, d }) => {
    const meta = AIRLINE_META_INFO[id] || {};
    const airlineName = meta.fullName || AIRLINE_SHORT_LABELS[id] || id;
    const originLabel = HUB_LABELS[d.origin] || d.origin || "—";
    const status = globalSearchStatusLabel(d);
    return `<div class="global-result-item" style="--airline-color:${meta.color || "#6ea8ff"}"
      onclick="selectGlobalRoute('${id}','${d.iata}','${d.origin || ""}')">
      <span class="global-airline-code">${id}</span>
      <span class="global-result-main">
        <span class="global-result-route"><span>${originLabel.split(" ")[0]}</span><span>→</span><span>${d.iata}</span><span class="global-result-city">${d.city || ""}</span></span>
        <span class="global-result-airline">${airlineName}</span>
      </span>
      <span class="global-result-status">${status}</span>
    </div>`;
  }).join("");
  resultsEl.style.display = "block";
}

function selectGlobalRoute(id, iata, origin) {
  const d = (AIRLINES[id] || []).find(x => x.iata === iata && String(x.origin || "") === String(origin || ""));
  if (!d) return;

  closeRoutePopup();
  hideInfoCard();
  clearSelectedAirport();
  closeFilterPanel();
  routeFilters.origins.clear();
  routeFilters.regions.clear();
  routeFilters.statuses = new Set(DEFAULT_ROUTE_STATUSES);
  routeFilters.statuses.add(routeStatusKey(d));

  if (activeAirline !== id) activeAirline = id;
  showAirline(id);
  updateUI();
  document.getElementById("search-input").value = "";
  document.getElementById("search-results").style.display = "none";

  map.flyTo(mapRouteCoord(d, id), 6, { duration: 1.2 });
  map.once("moveend", () => showCard(d, id));
}

function flyTo(iata, origin) {
  selectGlobalRoute(activeAirline, iata, origin);
}

// Feedback widget handlers
const FEEDBACK_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyyLemZKexsiJmzsBWDUzTuOXwKUzWZV3FLjozjWh58w47iEqD0T7Cl63pXFn-ipCokFQ/exec';
function fbOpen(){ document.getElementById('fb-overlay').classList.add('show'); document.getElementById('fb-msg').textContent=''; }
function fbClose(){ document.getElementById('fb-overlay').classList.remove('show'); }
const FB_STAR_LABELS = ['','非常差','差','普通','好','非常好'];
let fbRating = 0;
function fbHighlight(val){ document.querySelectorAll('.fb-star').forEach(s => s.classList.toggle('active', +s.dataset.val <= val)); }
// fb-star listeners moved inside DOMContentLoaded (see below) to ensure DOM is ready
// and to prevent any exception here from blocking the map initialisation.
async function fbSubmit(){
  const type=document.getElementById('fb-type').value;
  const desc=document.getElementById('fb-desc').value.trim();
  const contact=document.getElementById('fb-contact').value.trim();
  const msgEl=document.getElementById('fb-msg');
  if(!desc){ msgEl.textContent='請輸入內容'; msgEl.style.color='#ef4444'; return; }
  msgEl.textContent='送出中...'; msgEl.style.color='#8496a9';
  try{
    const res = await fetch(FEEDBACK_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type,description:desc,contact,rating:fbRating||null,page:location.href})});
    if(!res.ok) throw new Error('status '+res.status);
    msgEl.textContent='已送出，謝謝回報！'; msgEl.style.color='#2ca88e';
    document.getElementById('fb-desc').value=''; document.getElementById('fb-contact').value='';
    fbRating=0; fbHighlight(0); document.getElementById('fb-star-hint').textContent='';
    setTimeout(fbClose,1200);
  }catch(err){
    msgEl.textContent='送出失敗，請稍後再試'; msgEl.style.color='#ef4444';
  }
}
</script>
